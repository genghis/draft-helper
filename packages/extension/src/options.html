<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Draft Helper Sync — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.9rem;
      }
      input {
        padding: 0.45rem 0.6rem;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      #status {
        min-height: 1.2rem;
        font-weight: 600;
      }
      .ok { color: #27ae60; }
      .err { color: #c0392b; }
    </style>
  </head>
  <body>
    <h1>Draft Helper Sync</h1>
    <p>
      Paste the extension token from Draft Helper → Settings. While an ESPN
      draft room is open, picks sync automatically.
    </p>
    <label>
      Extension token
      <input id="token" type="password" autocomplete="off" />
    </label>
    <label>
      API base (leave default unless testing)
      <input id="apiBase" placeholder="https://draft.clanseafox.com/api" />
    </label>
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="test" type="button">Test connection</button>
    </div>
    <p id="status"></p>
    <p id="lastPush" style="opacity: 0.65"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
